name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle clean build
      - uses: actions/upload-artifact@v4
        with:
          name: MiraPlaytime-0.1.1
          path: build/libs/MiraPlaytime-0.1.1.jar

      - name: Publish v0.1.1 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.1 >/dev/null 2>&1; then
            gh release create v0.1.1 \
              build/libs/MiraPlaytime-0.1.1.jar \
              --target "${{ github.sha }}" \
              --title "MiraPlaytime v0.1.1" \
              --notes "Adds MiraCore playtime milestones, configurable timezone and history retention, rollover-safe daily/weekly periods, rank placeholders and stable UUID-backed MiraLeaderboards publishing."
          fi
