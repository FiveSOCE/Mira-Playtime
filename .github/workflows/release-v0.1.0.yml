name: Release v0.1.0
on:
  push:
    paths:
      - '.github/workflows/release-v0.1.0.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 818d91dfa89e5c86f04099f1bf3940f6eba382cf
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle clean build
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: MiraPlaytime v0.1.0
          target_commitish: 818d91dfa89e5c86f04099f1bf3940f6eba382cf
          body: Initial AFK-aware MiraPlaytime release with daily, weekly and all-time active playtime, leaderboards, PlaceholderAPI and public ServicesManager API.
          files: build/libs/MiraPlaytime-0.1.0.jar
